name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --omit=dev
      - name: Validate data
        run: npm run data:validate
      - name: Build static site
        run: npm run build
      - name: Run critical unit and integration tests
        # build 已校验共享核心并生成本次运行数据。
        run: npx vitest run --config config/vitest.release.config.mjs
      - name: Install Chromium
        run: |
          # Playwright 使用自带 Chromium，无需 runner 的 Google Chrome 软件源。
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "$RUNNER_TEMP/$(basename "$source").disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - name: Run critical end-to-end tests against this build
        run: npm run e2e
        env:
          E2E_PREBUILT: "1"

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            miniapp/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install miniapp dependencies
        run: npm ci --prefix miniapp
      - name: Generate runtime data
        run: npm run data:runtime
      - name: Run miniapp tests
        run: npm run miniapp:test
      - name: Build miniapp
        run: npm run miniapp:build

  # 保留既有状态检查名称；浏览器用例已在 validate 内验证同一份构建。
  e2e:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and critical browser tests
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = "success"
