name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --omit=dev
      - name: Verify current shared calculator core
        run: npm run test:core-current
      - name: Verify release acceptance evidence
        run: npm run acceptance:verify
      - name: Validate data
        run: npm run data:validate
      - name: Generate runtime data
        run: npm run data:runtime
      - name: Run unit and integration tests
        run: npm test
      - name: Build static site
        run: npm run build

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            miniapp/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install miniapp dependencies
        run: npm ci --prefix miniapp
      - name: Verify current shared calculator core
        run: npm run test:core-current
      - name: Generate runtime data
        run: npm run data:runtime
      - name: Run miniapp tests
        run: npm run miniapp:test
      - name: Build miniapp
        run: npm run miniapp:build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          # Playwright 使用自带 Chromium；无需 runner 的 Google Chrome 软件源。
          # 该源索引同步期间可能哈希不一致，仅在此临时 runner 停用它，保留 APT 校验。
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "$RUNNER_TEMP/$(basename "$source").disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run e2e
