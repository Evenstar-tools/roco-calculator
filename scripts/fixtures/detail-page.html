<!doctype html>
<html lang="zh-CN">
  <body>
    <div class="d-tab-contents">
      <div class="tab-content active">
        <img
          alt="JL shengguangdimo.png"
          src="https://patchwiki.biligame.com/images/rocom/thumb/2/2c/7qezwl2nb2ymfw4dos2vu163szd9p2h.png/480px-JL_shengguangdimo.png"
          width="480"
          height="480"
          data-file-width="1024"
          data-file-height="1024"
        >
      </div>
    </div>
    <div class="sprite-trait-name">诈死</div>
    <div class="sprite-trait-desc">自己力竭时，少损失1点魔力。</div>
    <div class="sprite-evolve-main">
      <button data-link="卡卡虫">卡卡虫</button>

    <div class="sprite-evolve-main">
      <button data-link="卡瓦重（火山附近的样子）">卡瓦重（火山附近的样子）</button>

    </div>
    <div class="sprite-skill-list">
      <div class="divsort skill-single" data-param1="默认" data-param2="物攻" data-param3="火">
        <div class="skill-single-head">
          <div class="skill-single-head-info">
            <span class="skill-name">火苗</span>
          </div>
        </div>
        <div class="skill-source-row">
          <div class="skill-source">解锁：Lv.1</div>
        </div>
      </div>
      <div class="divsort skill-single" data-param1="技能石" data-param2="物攻" data-param3="火">
        <div class="skill-single-head">
          <div class="skill-single-head-info">
            <span class="skill-name">火苗</span>
          </div>
        </div>
        <div class="skill-source-row">
          <div class="skill-source">技能石</div>
        </div>
      </div>
    </div>

</html>
